# Production stack (home server). Usage: make prod-up
name: mercadona

# Only `backend` builds the image; worker and beat reuse it (building the same tag
# from three services in parallel fails on Docker 29).
x-backend: &backend
  image: mercadona-backend:prod
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
  volumes:
    - ./secrets:/app/secrets
    - media:/app/media
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    <<: *backend
    build:
      context: ./backend
      args:
        UV_SYNC_ARGS: --no-dev
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput -v 0 &&
             gunicorn config.wsgi:application -b 0.0.0.0:8000 -w 3 --timeout 120"

  worker:
    <<: *backend
    command: celery -A config worker -l info --concurrency 2

  beat:
    <<: *backend
    command: celery -A config beat -l info -s /tmp/celerybeat-schedule

  # Daily database dump + receipt PDFs into ./backups (see deploy/backup.sh)
  backup:
    image: postgres:16-alpine
    env_file: .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TIME_ZONE:-Europe/Madrid}
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/usr/local/bin/backup.sh:ro
      - media:/media:ro
    command: >
      sh -c 'echo "${BACKUP_MINUTE:-30} ${BACKUP_HOUR:-3} * * * /bin/sh /usr/local/bin/backup.sh" | crontab - &&
             exec crond -f -l 8'
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    image: mercadona-web:prod
    volumes:
      - media:/media:ro
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  pgdata:
  media:
