# Production stack (home server). Usage: make prod-up
name: mercadona

x-backend: &backend
  build:
    context: ./backend
    args:
      UV_SYNC_ARGS: --no-dev
  image: mercadona-backend:prod
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
  volumes:
    - ./secrets:/app/secrets
    - media:/app/media
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    <<: *backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput -v 0 &&
             gunicorn config.wsgi:application -b 0.0.0.0:8000 -w 3 --timeout 120"

  worker:
    <<: *backend
    command: celery -A config worker -l info --concurrency 2

  beat:
    <<: *backend
    command: celery -A config beat -l info -s /tmp/celerybeat-schedule

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    image: mercadona-web:prod
    volumes:
      - media:/media:ro
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  pgdata:
  media:
